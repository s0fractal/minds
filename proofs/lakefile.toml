name = "vars1proofs"
defaultTargets = ["Vars1"]

[[lean_lib]]
name = "Vars1"

# Stage 2 link to Book I's mechanized evaluator. Not a default target. SigmaEval/ holds three files copied from
# sigma-glyph v0.8.0, identical at the spec's pin (see SigmaEval/SOURCE).
[[lean_lib]]
name = "SigmaEval"
srcDir = "SigmaEval"
roots = ["Sha256", "MachineBytes", "EvalMachine"]

[[lean_lib]]
name = "Vars1Sigma"
roots = ["Vars1Sigma"]

# The executable lens (Vars1/Exec.lean) compiled for differential checks against kernel/lens.wasm.
[[lean_exe]]
name = "vars1exec"
root = "Vars1ExecMain"

# The model's own fold (Vars1/Fold.lean `run`) compiled, for differential checks against kernel/lens.wasm.
[[lean_exe]]
name = "vars1fold"
root = "Vars1FoldMain"

# The model's cycle checker (Vars1/Cycle.lean `checkCycle`) compiled, for differential checks against
# sigma_resume.verify_cycle.
[[lean_exe]]
name = "vars1cycle"
root = "Vars1CycleMain"
