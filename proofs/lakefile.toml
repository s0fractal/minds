name = "vars1proofs"
defaultTargets = ["Vars1"]

[[lean_lib]]
name = "Vars1"

# Stage 2 link to Book I's mechanized evaluator. Not a default target: it reads
# the sibling checkout ~/Projects/sigma-glyph/proofs (pinned in VARS-1-SPEC.md; releases record the commit).
[[lean_lib]]
name = "SigmaEval"
srcDir = "../../sigma-glyph/proofs"
roots = ["Sha256", "MachineBytes", "EvalMachine"]

[[lean_lib]]
name = "Vars1Sigma"
roots = ["Vars1Sigma"]

# The executable lens (Vars1/Exec.lean) compiled for differential checks against kernel/lens.wasm.
[[lean_exe]]
name = "vars1exec"
root = "Vars1ExecMain"

# The model's own fold (Vars1/Fold.lean `run`) compiled, for differential checks against kernel/lens.wasm.
[[lean_exe]]
name = "vars1fold"
root = "Vars1FoldMain"
