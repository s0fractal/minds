# Every check a release runs, on a fresh runner with nothing beside the repository.
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # the tests build chain commits with git commit-tree
      GIT_AUTHOR_NAME: ci
      GIT_AUTHOR_EMAIL: ci@invalid
      GIT_COMMITTER_NAME: ci
      GIT_COMMITTER_EMAIL: ci@invalid
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch the self-governance chain (refs/vars/*)
        run: git fetch --no-tags origin '+refs/vars/*:refs/vars/*'

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install Book I (sigma-glyph, hash-pinned)
        run: python -m pip install --require-hashes -r requirements.txt

      - name: Rebuild the rules kernel; it must hash to H_LENS_KERNEL
        working-directory: kernel
        run: |
          cargo build --release --target wasm32-unknown-unknown
          built=$(sha256sum target/wasm32-unknown-unknown/release/vars_lens.wasm | cut -d' ' -f1)
          pinned=$(python -c "import sys; sys.path.insert(0, '..'); import vars1; print(vars1.H_LENS_KERNEL.hex())")
          echo "built $built pinned $pinned"
          test "$built" = "$pinned"
      - name: Rebuild the v2 rules kernel; it must hash to H_LENS_KERNEL_V2
        working-directory: kernel2
        run: |
          cargo build --release --target wasm32-unknown-unknown
          built=$(sha256sum target/wasm32-unknown-unknown/release/vars_lens2.wasm | cut -d' ' -f1)
          pinned=$(python -c "import sys; sys.path.insert(0, '..'); import vars1; print(vars1.H_LENS_KERNEL_V2.hex())")
          echo "built $built pinned $pinned"
          test "$built" = "$pinned"

      - name: Rebuild the v1b rules kernel; it must hash to H_LENS_KERNEL_V1B
        working-directory: kernel
        run: |
          cargo build --release --target wasm32-unknown-unknown --features commit-bound
          built=$(sha256sum target/wasm32-unknown-unknown/release/vars_lens.wasm | cut -d' ' -f1)
          pinned=$(python -c "import sys; sys.path.insert(0, '..'); import vars1; print(vars1.H_LENS_KERNEL_V1B.hex())")
          echo "built $built pinned $pinned"
          test "$built" = "$pinned"

      - name: Install elan (Lean toolchain from proofs/lean-toolchain)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/227caca133724d5516bee25c2aeb3e609478f2d8/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.elan/toolchains
            proofs/.lake
          key: lean-${{ hashFiles('proofs/lean-toolchain') }}-${{ hashFiles('proofs/**/*.lean', 'proofs/lakefile.toml') }}
          restore-keys: lean-${{ hashFiles('proofs/lean-toolchain') }}-
      - name: Lean proofs and executables
        working-directory: proofs
        run: |
          lake build
          lake build vars1exec
          lake build vars1fold
          lake build vars1cycle
          lake build vars1mask
          lake build vars1witness
          lake build Vars1Sigma

      - name: F42 vectors are the oracle's
        run: python tools/f42_vectors.py --check

      - name: Conformance
        env:
          MINDS_REQUIRE_CHAIN: "1" # the chain was fetched above: test 25 fails here rather than skip
          MINDS_REQUIRE_LEAN: "1" # built above: test 88 runs I9 and I10 on its rules changes
        run: python -m unittest -v test_vars1
      - name: Witness spike (experiments/witness/README.md)
        env:
          MINDS_REQUIRE_LEAN: "1" # built above: every check also runs vars1witness and must agree
          MINDS_REQUIRE_CHAIN: "1" # fetched above: test 13 holds every decision the lens settles on the live chain
        run: python experiments/witness/test_witness.py
      - name: Fold-candidates (experiments/decisions/README.md)
        env:
          MINDS_REQUIRE_CHAIN: "1" # fetched above: test 02 folds 100 readings on the live chain
        run: python experiments/decisions/test_decisions.py
      - name: Decision profile (experiments/decisions/README.md)
        env:
          MINDS_REQUIRE_CHAIN: "1" # fetched above: test 03 reads every decision of the live chain
        run: python experiments/decisions/test_profile.py
      - name: Property suite (I0–I12, and I9–I10 on every tip of the live chain)
        env:
          MINDS_REQUIRE_CHAIN: "1"
        run: python test_vars1_props.py
      - name: Spec claims (every normative block held by a witness)
        run: python tools/check_claims.py

  mutant-parts:
    # every tested or differential claim's mutants must be killed by the tests that witness it: mutants.json in three
    # shards (every third mutant in sorted order, tools/run_mutants.py --shard), each run by every CPU of its runner,
    # and the witness spike's mutants beside them
    name: mutants ${{ matrix.part }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        part: ["1/3", "2/3", "3/3", "witness"]
    env:
      GIT_AUTHOR_NAME: ci
      GIT_AUTHOR_EMAIL: ci@invalid
      GIT_COMMITTER_NAME: ci
      GIT_COMMITTER_EMAIL: ci@invalid
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install Book I (sigma-glyph, hash-pinned)
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Install elan (Lean toolchain from proofs/lean-toolchain)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/227caca133724d5516bee25c2aeb3e609478f2d8/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.elan/toolchains
            proofs/.lake
          key: lean-${{ hashFiles('proofs/lean-toolchain') }}-${{ hashFiles('proofs/**/*.lean', 'proofs/lakefile.toml') }}
          restore-keys: lean-${{ hashFiles('proofs/lean-toolchain') }}-
      - name: The Lean executables (the mutants' tests run I9, I10 and the witness checker)
        working-directory: proofs
        run: |
          lake build vars1exec
          lake build vars1fold
          lake build vars1witness
      - name: Mutants (a shard of mutants.json, or the witness spike's)
        env:
          MINDS_REQUIRE_LEAN: "1"
          PART: ${{ matrix.part }}
        run: |
          if [ "$PART" = witness ]; then
            python experiments/witness/test_witness.py --mutants
          else
            python tools/run_mutants.py --shard "$PART"
          fi

  mutants:
    # the required check of .warrant/merge.json: green only when every part above passed (a part that failed, was
    # cancelled or was skipped makes it red)
    needs: mutant-parts
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every shard and the witness spike's mutants passed
        env:
          RESULT: ${{ needs.mutant-parts.result }}
        run: test "$RESULT" = success
