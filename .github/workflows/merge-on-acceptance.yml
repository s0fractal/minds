name: merge-on-acceptance

# Merges a pull request the review loop has accepted, with no owner act and no agent act: the merge is the bot's
# (github-actions), so the history names who merged. The predicate is warrant's merge gate (warrant/gate.py of
# warrant-graph, at the exact version and wheel hash .github/merge-gate-requirements.txt names; its module docstring
# states the predicate, s0fractal/warrant docs/V3.md §14 the protocol), read against this repository's
# .warrant/merge.json and .warrant/v3.json at main's tip. Only trusted code runs here: this file is main's
# (workflow_run and schedule always run the default branch's workflow; a dispatch from another ref is refused
# below), the working tree is main at the exact commit GitHub reports for it, the gate is the pinned wheel, run
# isolated (python -I: neither the working tree nor PYTHONPATH can shadow it), and every pull request head is
# fetched as Git objects into refs/warrant-gate/pull/<n>, read with git ls-tree / cat-file / diff-tree, never
# checked out, installed or run.
#
# What it merges today: a pull request whose head version (a pr-head@1 lineage in its .warrant/records.jsonl,
# REVIEWING.md §0) a pr/acceptor of .warrant/v3.json (codex) accepted, with no counted finding standing, the
# required checks (check, mutants) green at the head, and no owner path changed. A pull request with no review
# lineage, or one only Claude has reviewed, is not merged by this gate: the published gate has no solo path yet.
#
# At most one merge per run, with a merge commit, bound to the head assessed (GitHub refuses the merge when the
# head moved). A merge made with GITHUB_TOKEN starts no push workflow, so the gate then dispatches the required
# workflow (check.yml) on main: main CI still runs after every merge this gate makes.
#
# Holds, the owner's, with no code:
#   - the label `hold` on a pull request (.warrant/merge.json hold_label): that pull request is not merged;
#   - the repository variable WARRANT_MERGE_GATE=hold (`gh variable set WARRANT_MERGE_GATE --body hold`): nothing is
#     merged;
#   - `gh workflow disable merge-on-acceptance.yml`: the gate does not run.
# Every refusal reason of every open pull request is written to the job summary.
on:
  workflow_run:
    workflows: [check]
    types: [completed]
  schedule:
    - cron: '11,41 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: merge-on-acceptance
  cancel-in-progress: false

jobs:
  gate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write          # the merge
      pull-requests: write     # the merge
      checks: read             # the required checks at a pull request's head
      actions: write           # the runs behind those checks; dispatching main CI after a merge
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      # No checkout action: main is fetched by hand and checked out at the id GitHub reports for it, so the
      # repository read is that commit's, whole, and nothing of a pull request is checked out.
      - name: The base read is main's tip on GitHub, and only it
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tip=$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)
          [[ "$tip" =~ ^[0-9a-f]{40}$ ]]
          git init -q .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git fetch -q --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          if [ "$(git rev-parse refs/remotes/origin/main)" != "$tip" ]; then
            echo "main moved while it was fetched: nothing assessed; a later run reads it." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git checkout -q --detach "$tip"
          [ -z "$(git status --porcelain --untracked-files=all)" ]
          echo "base=$tip" >> "$GITHUB_OUTPUT"

      - name: The gate (warrant-graph, exact version and hashes)
        if: steps.base.outputs.base != ''
        run: python -m pip install --quiet --only-binary ':all:' --require-hashes -r .github/merge-gate-requirements.txt

      - name: Assess the open pull requests; merge one that is eligible
        if: steps.base.outputs.base != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ steps.base.outputs.base }}
          GATE_VAR: ${{ vars.WARRANT_MERGE_GATE }}
        run: |
          set -euo pipefail
          python -I -m warrant.gate --root "$GITHUB_WORKSPACE" gate --base "$BASE" --merge \
            --gate-var "$GATE_VAR" --summary "$GITHUB_STEP_SUMMARY"
