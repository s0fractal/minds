# The witness member's key (REVIEWING.md §1): made once on a GitHub runner and kept as the secret MINDS_WITNESS_SEED
# of the environment `witness`, which only main may deploy to. The seed never leaves GitHub; this run prints only its
# public key, which a member adds to the roster with `tools/minds_chain.py join PUBKEY github-actions`. Making the
# secret takes MINDS_SECRETS_TOKEN (a token of the owner's, of this repository, allowed to write environment secrets),
# needed once and deleted after.
name: witness-key

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  key:
    runs-on: ubuntu-24.04
    environment: witness
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"
      - name: Install Book I (sigma-glyph, hash-pinned)
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Make the key once; print its public key
        env:
          SEED: ${{ secrets.MINDS_WITNESS_SEED }}
          GH_TOKEN: ${{ secrets.MINDS_SECRETS_TOKEN }}
        run: |
          if [ -z "$SEED" ]; then
            if [ -z "$GH_TOKEN" ]; then
              echo "the environment witness holds neither MINDS_WITNESS_SEED nor MINDS_SECRETS_TOKEN" >&2
              exit 1
            fi
            # no key for an environment other branches could deploy to: their workflows would read it
            custom=$(gh api "repos/$GITHUB_REPOSITORY/environments/witness" --jq '.deployment_branch_policy.custom_branch_policies')
            branches=$(gh api "repos/$GITHUB_REPOSITORY/environments/witness/deployment-branch-policies" \
              --jq '[.branch_policies[] | [.name, .type]]' | tr -d ' \n')
            if [ "$custom" != "true" ] || [ "$branches" != '[["main","branch"]]' ]; then
              echo "refused: the environment witness must be deployable from main alone (custom $custom, $branches)" >&2
              exit 1
            fi
            SEED=$(python -c "import os; print(os.urandom(32).hex())")
            echo "::add-mask::$SEED"
            printf %s "$SEED" | gh secret set MINDS_WITNESS_SEED --env witness --repo "$GITHUB_REPOSITORY"
            echo "made MINDS_WITNESS_SEED in the environment witness; MINDS_SECRETS_TOKEN may be deleted now"
          fi
          printf %s "$SEED" | python -c "import sys, vars1; print('witness public key', vars1.ed25519_pubkey(bytes.fromhex(sys.stdin.read().strip())).hex())"
